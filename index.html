<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK SWASTA ASSISI - Portal Akademik Terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#e3242b', primaryDark: '#b91c22', surface: '#f8fafc' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; -webkit-font-smoothing: antialiased; }
        .hidden-section { display: none !important; }
        .prevent-select { user-select: none; -webkit-user-select: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Table Styling */
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; font-size: 12px; text-transform: uppercase; padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; background: white; vertical-align: top; }
        
        /* Modal & Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- ================= 1. HALAMAN LOGIN ================= -->
    <div id="view-login" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 fade-in">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-primary">
            <div class="text-center mb-8">
                <div class="bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
                    <i class="fas fa-school"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">SMK SWASTA ASSISI</h2>
                <p class="text-slate-500 text-sm mt-1">SELAMAT DATANG DI Sistem SMK SWASTA ASSISI</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PERAN AKSES</label>
                    <select id="login-role" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        <option value="Siswa">SISWA/I</option>
                        <option value="Guru">GURU</option>
                        <option value="Admin">ADMIN</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">USERNAME</label>
                    <input type="text" id="login-username" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan NAMA/NIS/NIP">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PASSWORD</label>
                    <input type="password" id="login-Password" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan PASSWORD">
                </div>
                <button onclick="prosesLogin()" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition duration-200">
                    LOGIN
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. SIDEBAR ================= -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm hidden-section z-20 h-full">
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-primary text-white p-2 rounded-lg"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <h1 class="font-bold text-slate-800 leading-tight">SMK ASSISI</h1>
                <span id="badge-role" class="text-[10px] font-bold bg-slate-100 text-primary px-2 py-0.5 rounded-full uppercase tracking-wider">ROLE</span>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5" id="nav-menu">
            <!-- Nav buttons generated via JS based on role -->
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold"><i class="fas fa-user"></i></div>
                <div class="overflow-hidden">
                    <p id="display-name" class="text-sm font-bold text-slate-800 truncate">User</p>
                </div>
            </div>
            <button onclick="prosesLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-lg text-white bg-slate-800 hover:bg-slate-900 transition-colors">
                <i class="fas fa-power-off"></i> KELUAR
            </button>
        </div>
    </aside>

    <!-- ================= 3. MAIN CONTENT ================= -->
    <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden hidden-section bg-slate-50">
        <!-- TOPBAR PERINGATAN UJIAN + JAM BERJALAN & SISA WAKTU -->
        <div id="topbar-warning" class="hidden-section bg-primary text-white px-6 py-3 flex flex-wrap justify-between items-center gap-3 shadow-md z-10">
            <div class="font-bold flex items-center gap-2">
                <i class="fas fa-shield-alt animate-pulse"></i>
                <span>MODE UJIAN AKTIF (ANTI-CHEAT)</span>
                <span id="exam-active-mapel" class="text-xs bg-white text-primary px-2 py-0.5 rounded font-extrabold">MAPEL</span>
            </div>
            <div class="flex items-center gap-4">
                <!-- Jam Berjalan Real-Time -->
                <div class="bg-slate-900/60 px-3 py-1.5 rounded-lg border border-white/20 flex items-center gap-2">
                    <i class="far fa-clock text-amber-300"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-slate-200 uppercase">Jam Sekarang</span>
                        <span id="live-clock-display" class="font-mono font-bold text-sm">00:00:00</span>
                    </div>
                </div>
                <!-- Hitung Mundur Sisa Waktu -->
                <div class="bg-black/30 px-4 py-1.5 rounded-lg border border-white/30 flex items-center gap-2">
                    <i class="fas fa-hourglass-half text-red-200 animate-spin"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-red-100 uppercase">Sisa Waktu</span>
                        <span id="timer-display" class="font-mono font-bold text-lg">00:00:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6" id="content-area">
            <!-- Tempat Konten Menu Dirender -->
        </div>
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        /* --- STATE & DATABASE LOKAL (LocalStorage) --- */
        let currentUser = { role: '', name: '' };
        let isExamActive = false;
        let examTimer = null;
        let liveClockInterval = null;
        let activeExamSubject = '';
        let html5QrScanner = null;
        let activeCameraStream = null;

        let db = {
            jadwalUjian: JSON.parse(localStorage.getItem('db_jadwalUjian')) || [],
            jadwalHarian: JSON.parse(localStorage.getItem('db_jadwalHarian')) || [],
            presensi: JSON.parse(localStorage.getItem('db_presensi')) || [],
            materi: JSON.parse(localStorage.getItem('db_materi')) || [],
            soal: JSON.parse(localStorage.getItem('db_soal')) || [],
            hasilUjian: JSON.parse(localStorage.getItem('db_hasilUjian')) || [],
            nilaiTugas: JSON.parse(localStorage.getItem('db_nilaiTugas')) || [],
            catatanSiswa: JSON.parse(localStorage.getItem('db_catatanSiswa')) || [],
            sesiQR: JSON.parse(localStorage.getItem('db_sesiQR')) || []
        };

        const listKelas = ["10 RPL", "10 TB", "10 AK", "11 RPL", "11 TB", "11 AK", "12 RPL", "12 TB", "12 AK"];
        const listMapel = ["Agama", "PKN", "Bahasa Indonesia", "Matematika", "Bahasa Inggris", "Kejuruan RPL", "Kejuruan TB", "Kejuruan AK", "IPA", "IPS"];
        const listGuru = ["Sr.Gaudensia Silalahi", "H.Tindaon", "P.Tambunan", "E.Sirait", "E.Silalahi", "A.Lumbantobing", "M.Haloho", "E.Nainggolan", "L.Panggabean", "E.Gultom", "K.Silitonga", "O.Nadeak"];

        function saveData() {
            localStorage.setItem('db_jadwalUjian', JSON.stringify(db.jadwalUjian));
            localStorage.setItem('db_jadwalHarian', JSON.stringify(db.jadwalHarian));
            localStorage.setItem('db_presensi', JSON.stringify(db.presensi));
            localStorage.setItem('db_materi', JSON.stringify(db.materi));
            localStorage.setItem('db_soal', JSON.stringify(db.soal));
            localStorage.setItem('db_hasilUjian', JSON.stringify(db.hasilUjian));
            localStorage.setItem('db_nilaiTugas', JSON.stringify(db.nilaiTugas));
            localStorage.setItem('db_catatanSiswa', JSON.stringify(db.catatanSiswa));
            localStorage.setItem('db_sesiQR', JSON.stringify(db.sesiQR));
        }

        function stopMediaResources() {
            if (html5QrScanner) {
                try {
                    html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {});
                } catch (e) {}
                html5QrScanner = null;
            }
            if (activeCameraStream) {
                activeCameraStream.getTracks().forEach(track => track.stop());
                activeCameraStream = null;
            }
        }

        /* --- JAM BERJALAN REAL-TIME --- */
        function startLiveClock() {
            if (liveClockInterval) clearInterval(liveClockInterval);
            const updateClock = () => {
                const now = new Date();
                const jamStr = now.toLocaleTimeString('id-ID', { hour12: false });
                const elTopbar = document.getElementById('live-clock-display');
                const elDash = document.getElementById('dashboard-live-clock');
                if (elTopbar) elTopbar.innerText = jamStr + ' WIB';
                if (elDash) elDash.innerText = jamStr + ' WIB';
            };
            updateClock();
            liveClockInterval = setInterval(updateClock, 1000);
        }

        /* --- LOGIN & LOGOUT --- */
        function prosesLogin() {
            let role = document.getElementById('login-role').value;
            let name = document.getElementById('login-username').value.trim();
            if (!name) { alert('Nama pengguna wajib diisi!'); return; }

            currentUser = { role, name };
            document.getElementById('view-login').classList.add('hidden-section');
            document.getElementById('sidebar').classList.remove('hidden-section');
            document.getElementById('main-content').classList.remove('hidden-section');
            
            document.getElementById('badge-role').innerText = role;
            document.getElementById('display-name').innerText = name;
            
            startLiveClock();
            renderMenu();
            renderDashboard();
        }

        function prosesLogout() {
            if (isExamActive) {
                picuAntiCheat("Sistem menolak logout. Anda masih dalam sesi ujian aktif!");
                return;
            }
            stopMediaResources();
            location.reload();
        }

        /* --- NAVIGASI --- */
        function renderMenu() {
            const menu = document.getElementById('nav-menu');
            let html = `<button onclick="renderDashboard()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary transition-colors"><i class="fas fa-home w-5"></i> Beranda</button>`;
            
            if (currentUser.role === 'Admin') {
                html += `
                    <button onclick="renderJadwalUjian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-check w-5"></i> Buat & Jadwal Ujian</button>
                    <button onclick="renderJadwalHarian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-alt w-5"></i> Jadwal Harian</button>
                    <button onclick="renderGeneratorQR()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-qrcode w-5"></i> Buat Kode QR Presensi</button>
                    <button onclick="renderPresensi()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-camera-retro w-5"></i> Rekap Presensi & Foto</button>
                    <button onclick="renderMateri()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-book w-5"></i> Manajemen Materi</button>
                    <button onclick="renderManajemenSoal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-file-alt w-5"></i> Buat Soal Ujian CBT</button>
                    <button onclick="renderUploadNilaiTugas()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-upload w-5"></i> Upload Nilai Tugas</button>
                    <button onclick="renderUploadCatatanSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-sticky-note w-5"></i> Upload Catatan Siswa</button>
                    <button onclick="renderLaporan()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-chart-bar w-5"></i> Laporan Nilai Ujian</button>
                `;
            } else if (currentUser.role === 'Guru') {
                html += `
                    <button onclick="renderPresensiScanForm('Guru')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold rounded-lg bg-red-50 text-primary hover:bg-red-100 transition-colors"><i class="fas fa-qrcode w-5"></i> Scan QR & Bukti Foto Guru</button>
                    <button onclick="renderJadwalUjian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-check w-5"></i> Buat Jadwal Ujian</button>
                    <button onclick="renderManajemenSoal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-file-alt w-5"></i> Buat Soal Ujian CBT</button>
                    <button onclick="renderJadwalHarian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-alt w-5"></i> Jadwal Harian</button>
                    <button onclick="renderGeneratorQR()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-qrcode w-5"></i> Buat QR Absen Siswa</button>
                    <button onclick="renderPresensi()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-camera-retro w-5"></i> Rekap Kehadiran & Foto</button>
                    <button onclick="renderUploadNilaiTugas()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-upload w-5"></i> Upload Nilai Tugas</button>
                    <button onclick="renderUploadCatatanSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-sticky-note w-5"></i> Upload Catatan Siswa</button>
                    <button onclick="renderMateri()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-book w-5"></i> Manajemen Materi</button>
                    <button onclick="renderLaporan()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-chart-bar w-5"></i> Laporan Nilai Ujian</button>
                `;
            } else if (currentUser.role === 'Siswa') {
                html += `
                    <button onclick="renderPresensiScanForm('Siswa')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold rounded-lg bg-red-50 text-primary hover:bg-red-100 transition-colors"><i class="fas fa-qrcode w-5"></i> Scan QR & Bukti Foto</button>
                    <button onclick="renderJadwalSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar w-5"></i> Jadwal Saya</button>
                    <button onclick="renderUjianSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-laptop-code w-5"></i> Portal Ujian</button>
                    <button onclick="renderNilaiTugasSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-tasks w-5"></i> Nilai Tugas Saya</button>
                    <button onclick="renderCatatanSiswaView()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-clipboard-list w-5"></i> Catatan Guru Untuk Saya</button>
                    <button onclick="renderMateriSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-book w-5"></i> Materi Pembelajaran</button>
                    <button onclick="renderNilaiSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-award w-5"></i> Hasil & Nilai Ujian</button>
                `;
            }
            menu.innerHTML = html;
        }

        function setContent(html) {
            if (isExamActive) {
                picuAntiCheat("Dilarang berpindah menu selama ujian berlangsung!");
                return;
            }
            stopMediaResources();
            document.getElementById('content-area').innerHTML = `<div class="fade-in">${html}</div>`;
        }

        /* --- GENERATOR OPSI --- */
        function genOptions(arr) { return arr.map(a => `<option value="${a}">${a}</option>`).join(''); }
        function genNumOptions(start, end) { 
            let res = ''; for(let i=start; i<=end; i++) res += `<option value="${i}">${i}</option>`; return res; 
        }

        /* ================= FITUR 1: BERANDA ================= */
        function renderDashboard() {
            const isSiswa = currentUser.role === 'Siswa';
            const myPresensiCount = db.presensi.filter(p => p.nama.toLowerCase() === currentUser.name.toLowerCase()).length;

            setContent(`
                <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">Selamat Datang, ${currentUser.name}!</h2>
                        <p class="text-slate-500">Anda login sebagai <span class="font-bold text-primary">${currentUser.role}</span> di Sistem Akademik SMK Swasta Assisi.</p>
                    </div>
                    <div class="bg-slate-900 text-white px-5 py-3 rounded-xl text-right">
                        <span class="text-[11px] uppercase tracking-wider text-slate-400 block">Waktu Server Saat Ini</span>
                        <span id="dashboard-live-clock" class="text-xl font-mono font-bold text-emerald-400">--:--:-- WIB</span>
                    </div>
                </div>

                <!-- Akses Cepat Scan QR & Bukti Foto untuk Guru dan Siswa -->
                ${(isSiswa || isGuru) ? `
                <div class="bg-gradient-to-r from-primary to-red-700 text-white p-6 rounded-xl shadow-md mb-6 flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <span class="text-xs uppercase font-bold bg-white/20 px-2.5 py-1 rounded">Presensi Digital & Kamera Bukti</span>
                        <h3 class="text-xl font-bold mt-2">Scan QR Kehadiran ${currentUser.role} (Sehari-Hari & Ujian)</h3>
                        <p class="text-sm text-red-100 mt-1">Lakukan scan QR kehadiran beserta pengambilan bukti foto kehadiran secara langsung.</p>
                    </div>
                    <button onclick="renderPresensiScanForm('${currentUser.role}')" class="bg-white text-primary hover:bg-slate-100 font-bold px-6 py-3 rounded-xl shadow transition flex items-center gap-2">
                        <i class="fas fa-qrcode text-lg"></i> BUKA SCANNER QR & FOTO BUKTI
                    </button>
                </div>
                ` : ''}

                <!-- Ringkasan Data -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Jadwal Ujian Aktif</p>
                        <p class="text-3xl font-bold text-primary mt-1">${db.jadwalUjian.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Ditetapkan Admin/Guru</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">${isSiswa ? 'Nilai Tugas Saya' : 'Total Nilai Tugas'}</p>
                        <p class="text-3xl font-bold text-blue-600 mt-1">${isSiswa ? db.nilaiTugas.filter(t => t.namaSiswa.toLowerCase() === currentUser.name.toLowerCase()).length : db.nilaiTugas.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Tersinkronisasi otomatis</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">${isSiswa ? 'Catatan Untuk Saya' : 'Total Catatan Siswa'}</p>

        function buatSesiQR(e) {

            db.sesiQR.push(sesi);
            saveData();
            renderGeneratorQR();
        }

        function tampilkanQR(kode, caption) {
            const container = document.getElementById('qrcode-container');
            const capEl = document.getElementById('qr-caption');
            const textEl = document.getElementById('qr-code-text');
            if (!container) return;
            container.innerHTML = '';
            new QRCode(container, { text: kode, width: 200, height: 200 });
            if (capEl) capEl.innerText = caption;
            if (textEl) textEl.innerText = kode;
        }

        function mulaiKameraQR() {
            const box = document.getElementById('qr-reader-box');
            const btnStop = document.getElementById('btn-stop-qr');
            if (!box) return;
            box.classList.remove('hidden-section');
            if (btnStop) btnStop.classList.remove('hidden-section');

            try {
                html5QrScanner = new Html5Qrcode("qr-reader");
                html5QrScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        document.getElementById('pres-qr-code').value = decodedText;
                        if (decodedText.toUpperCase().includes('UJIAN')) {
                            document.getElementById('pres-tipe').value = 'Ujian';
                        } else if (decodedText.toUpperCase().includes('HARIAN')) {
                            document.getElementById('pres-tipe').value = 'Sehari-hari';
                        }
                        hentikanKameraQR();
                        alert("QR Code berhasil terbaca: " + decodedText);
                    },
                    () => {}
                ).catch(err => {
                    alert("Kamera QR tidak dapat diakses di browser ini. Silakan pilih kode QR aktif atau ketik kode QR secara manual.");
                    hentikanKameraQR();
                });
            } catch (e) {
                alert("Pemindai kamera tidak tersedia. Gunakan pilihan QR aktif di kolom bawah.");
                hentikanKameraQR();
            }
        }

        function hentikanKameraQR() {
            const box = document.getElementById('qr-reader-box');
            const btnStop = document.getElementById('btn-stop-qr');
            if (html5QrScanner) {
                try { html5QrScanner.stop().then(() => html5QrScanner.clear()).catch(() => {}); } catch (e) {}
                html5QrScanner = null;
            }
            if (box) box.classList.add('hidden-section');
            if (btnStop) btnStop.classList.add('hidden-section');
        }

        function bukaKameraSelfie() {
            const camBox = document.getElementById('selfie-camera-box');
            const video = document.getElementById('selfie-video');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Browser tidak mendukung akses kamera langsung. Silakan gunakan tombol unggah foto di bawahnya.");
                return;
            }
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    activeCameraStream = stream;
                    video.srcObject = stream;
                    camBox.classList.remove('hidden-section');
                })
                .catch(() => {
                    alert("Izin kamera ditolak atau tidak tersedia. Silakan unggah file foto bukti kehadiran.");
                });
        }

        function jepretFotoSelfie() {
            const video = document.getElementById('selfie-video');
            if (!video) return;
            const canvas = document.createElement('canvas');
            canvas.width = 360;
            canvas.height = 270;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Tambahkan watermark waktu & nama pada bukti foto
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, canvas.height - 28, canvas.width, 28);
            ctx.fillStyle = "#ffffff";
            ctx.font = "11px sans-serif";
            ctx.fillText(`${currentUser.name} (${currentUser.role}) • ${new Date().toLocaleString('id-ID')}`, 8, canvas.height - 10);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            const imgEl = document.getElementById('pres-img-element');
            imgEl.src = dataUrl;
            imgEl.dataset.base64 = dataUrl;
            document.getElementById('pres-preview').classList.remove('hidden-section');
            tutupKameraSelfie();
        }

        function tutupKameraSelfie() {
            if (activeCameraStream) {
                activeCameraStream.getTracks().forEach(t => t.stop());
                activeCameraStream = null;
            }
            const camBox = document.getElementById('selfie-camera-box');
            if (camBox) camBox.classList.add('hidden-section');
        }

        function previewUpload(input, previewBoxId) {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let maxW = 360, maxH = 360;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxW) { height *= maxW / width; width = maxW; } }
                    else { if (height > maxH) { width *= maxH / height; height = maxH; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('pres-img-element').src = dataUrl;
                    document.getElementById('pres-img-element').dataset.base64 = dataUrl;
                    document.getElementById(previewBoxId).classList.remove('hidden-section');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

            let d = new Date();

                kunci: tipe === 'PG' ? document.getElementById('soal-kunci-pg').value : document.getElementById('soal-kunci-essay').value
            };
            if (id) db.soal = db.soal.map(x => x.id == id ? data : x);
            else db.soal.push(data);
            saveData(); renderManajemenSoal();
        }

        function editSoal(id) {
            let s = db.soal.find(x => x.id === id);
            if (!s) return;
            document.getElementById('soal-id').value = s.id;
            document.getElementById('soal-mapel').value = s.mapel;
            document.getElementById('soal-tipe').value = s.tipe;
            toggleTipeSoal(s.tipe);
            document.getElementById('soal-tanya').value = s.tanya;
            if (s.tipe === 'PG' && s.opsi) {
                document.getElementById('soal-a').value = s.opsi.A || '';
                document.getElementById('soal-b').value = s.opsi.B || '';
                document.getElementById('soal-c').value = s.opsi.C || '';
                document.getElementById('soal-d').value = s.opsi.D || '';
                document.getElementById('soal-e').value = s.opsi.E || '';
                document.getElementById('soal-kunci-pg').value = s.kunci;
            } else {
                document.getElementById('soal-kunci-essay').value = s.kunci;
            }
        }

        // Siswa: UI Portal Ujian (Mengambil Durasi Jam & Menit + Kode dari Jadwal Ujian Admin/Guru)
        function renderUjianSiswa() {
            let html = `
                <div class="max-w-3xl mx-auto mt-6">
                    <div class="text-center mb-6">
                        <i class="fas fa-shield-alt text-5xl text-primary mb-3"></i>
                        <h2 class="text-3xl font-bold text-slate-800">Portal Ujian CBT</h2>
                        <p class="text-slate-600 text-sm mt-1">Pilih jadwal ujian yang telah ditetapkan Admin/Guru. Durasi waktu (Jam & Menit) otomatis mengikuti pengaturan jadwal.</p>
                    </div>

                    ${db.jadwalUjian.length > 0 ? `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Pilih Jadwal Mata Ujian</label>
                                <select id="pilih-jadwal-ujian" class="w-full p-3 border rounded-lg font-semibold" onchange="updateInfoJadwalUjian()">
                                    ${db.jadwalUjian.map(j => `
                                        <option value="${j.id}">
                                            ${j.mapel} (${j.kelas}) — ${j.tgl} | Durasi: ${j.durasiJam || 0} Jam ${j.durasiMenit || 0} Menit
                                        </option>
                                    `).join('')}
                                </select>
                            </div>

                            <div id="box-info-ujian" class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm space-y-1">
                                <!-- Diisi otomatis via JS -->
                            </div>

                            <div>
                                <label class="block text-sm font-bold mb-1">Masukkan Kode Ujian / Token</label>
                                <input type="text" id="input-token-ujian" class="w-full p-3 border rounded-lg font-mono uppercase" placeholder="Masukkan kode dari pengawas/jadwal...">
                            </div>

                            <button onclick="mulaiUjianDariJadwal()" class="w-full bg-primary hover:bg-primaryDark text-white font-bold text-lg py-4 rounded-xl shadow-lg transition">
                                <i class="fas fa-play-circle mr-2"></i> MULAI UJIAN SEKARANG
                            </button>
                        </div>
                    ` : `
                        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
                            <p class="text-slate-500 font-semibold mb-2">Belum ada Jadwal Ujian yang dibuat oleh Admin atau Guru.</p>
                            <p class="text-xs text-slate-400">Silakan hubungi Admin/Guru untuk menerbitkan jadwal beserta durasi jam & menit ujian.</p>
                        </div>
                    `}
                </div>
            `;
            setContent(html);
            if (db.jadwalUjian.length > 0) updateInfoJadwalUjian();
        }

        function updateInfoJadwalUjian() {
            const select = document.getElementById('pilih-jadwal-ujian');
            const box = document.getElementById('box-info-ujian');
            if (!select || !box) return;
            const jadwal = db.jadwalUjian.find(j => j.id == select.value);
            if (!jadwal) return;

            const jmlSoalMapel = db.soal.filter(s => s.mapel === jadwal.mapel).length;
            const totalSoalTersedia = jmlSoalMapel > 0 ? jmlSoalMapel : db.soal.length;

            box.innerHTML = `
                <div class="flex justify-between"><span class="text-slate-500">Mata Ujian:</span><strong>${jadwal.mapel}</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Pengawas:</span><strong>${jadwal.pengawas}</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Durasi Ditetapkan:</span><strong class="text-primary">${jadwal.durasiJam || 0} Jam ${jadwal.durasiMenit || 0} Menit</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Jumlah Soal Siap:</span><strong>${totalSoalTersedia} Soal</strong></div>
            `;
        }

        function mulaiUjianDariJadwal() {
            const select = document.getElementById('pilih-jadwal-ujian');
            const jadwal = db.jadwalUjian.find(j => j.id == select.value);
            if (!jadwal) return;

            const inputKode = document.getElementById('input-token-ujian').value.trim().toUpperCase();
            if (jadwal.kodeUjian && inputKode !== jadwal.kodeUjian) {
                alert(`Kode Ujian salah! Periksa kembali kode ujian pada jadwal (Petunjuk: ${jadwal.kodeUjian}).`);
                return;
            }

            let daftarSoal = db.soal.filter(s => s.mapel === jadwal.mapel);
            if (daftarSoal.length === 0) daftarSoal = db.soal;

            if (daftarSoal.length === 0) {
                alert("Belum ada soal yang dibuat oleh Guru/Admin!");
                return;
            }

            const durasiJam = parseInt(jadwal.durasiJam || 0);
            const durasiMenit = parseInt(jadwal.durasiMenit || 0);
            let sisaDetik = (durasiJam * 3600) + (durasiMenit * 60);
            if (sisaDetik <= 0) sisaDetik = 3600;

            activeExamSubject = jadwal.mapel;
            isExamActive = true;
            document.getElementById('sidebar').classList.add('hidden-section');
            document.getElementById('topbar-warning').classList.remove('hidden-section');
            document.getElementById('exam-active-mapel').innerText = jadwal.mapel;
            startLiveClock();

            window.currentExamQuestions = daftarSoal;

            let formHtml = daftarSoal.map((s, idx) => {
                let konten = '';
                if(s.tipe === 'PG') {
                    for(const [key, val] of Object.entries(s.opsi)) {
                        konten += `<label class="block p-3 border rounded mb-2 cursor-pointer hover:bg-slate-50"><input type="radio" name="ans_${s.id}" value="${key}" class="mr-2"> ${key}. ${val}</label>`;
                    }
                } else {
                    konten = `<textarea name="ans_${s.id}" class="w-full h-32 p-3 border rounded outline-none focus:ring-2 focus:ring-primary" placeholder="Tulis uraian (100-900 kata)..."></textarea>`;
                }
                return `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-4" id="box_${s.id}">
                        <p class="font-bold text-lg mb-4">${idx+1}. ${s.tanya}</p>
                        ${konten}
                    </div>
                `;
            }).join('');

            let uiHtml = `
                <div class="max-w-4xl mx-auto prevent-select">
                    <form id="form-lembar-ujian">
                        ${formHtml}
                        <button type="button" onclick="kumpulUjian()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl py-5 rounded-xl shadow-lg mt-4">SIMPAN & KUMPULKAN JAWABAN</button>
                    </form>
                </div>
            `;
            document.getElementById('content-area').innerHTML = uiHtml;

            let display = document.getElementById('timer-display');
            let peringatan1Menit = false;

            const updateCountdown = () => {
                let h = Math.floor(sisaDetik / 3600);
                let m = Math.floor((sisaDetik % 3600) / 60);
                let s = sisaDetik % 60;
                display.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                if (sisaDetik === 60 && !peringatan1Menit) {
                    peringatan1Menit = true;
                    alert("Waktu tersisa 1 menit! Sistem akan otomatis mengumpulkan jawaban Anda.");
                }
                if (sisaDetik <= 0) {
                    clearInterval(examTimer);
                    alert("WAKTU HABIS! Sistem melakukan Kumpul Otomatis.");
                    kumpulUjian();
                }
                sisaDetik--;
            };

            updateCountdown();
            examTimer = setInterval(updateCountdown, 1000);
        }

        /* --- ANTI-CHEAT ENGINE --- */
        function picuAntiCheat(pesan) {
            try {
                let speech = new SpeechSynthesisUtterance("Peringatan! Pelanggaran Ujian Terdeteksi.");
                speech.lang = 'id-ID'; window.speechSynthesis.speak(speech);
            } catch(e){}
            alert("🚨 PELANGGARAN: " + pesan);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isExamActive) picuAntiCheat("Anda dilarang berpindah Tab atau Aplikasi selama ujian!");
        });
        document.addEventListener("contextmenu", (e) => { if(isExamActive) { e.preventDefault(); } });
        document.addEventListener("keydown", (e) => {
            if (isExamActive && (e.key === 'PrintScreen' || (e.ctrlKey && ['c','v','s','p'].includes(e.key.toLowerCase())))) {
                e.preventDefault(); navigator.clipboard.writeText(''); picuAntiCheat("Dilarang mengambil foto layar (Screenshot) / Menyalin Soal!");
            }
        });

        /* --- SUBMIT & HASIL REVIEW --- */
        function kumpulUjian() {
            clearInterval(examTimer);
            isExamActive = false;
            document.getElementById('topbar-warning').classList.add('hidden-section');
            document.getElementById('sidebar').classList.remove('hidden-section');

            let form = document.getElementById('form-lembar-ujian');
            let formData = new FormData(form);
            let benar = 0; let salah = 0;
            let soalDikerjakan = window.currentExamQuestions || db.soal;
            
            let reviewHtml = `<div class="max-w-4xl mx-auto"><h2 class="text-3xl font-bold text-slate-800 mb-6">Hasil & Review Ujian (${activeExamSubject})</h2>`;

            soalDikerjakan.forEach((s, idx) => {
                let jwbSiswa = formData.get(`ans_${s.id}`) || "";
                let isBenar = false;
                
                if (s.tipe === 'PG') {
                    isBenar = (jwbSiswa === s.kunci);
                } else {
                    isBenar = (jwbSiswa.trim().length > 10);
                }
                
                if (isBenar) benar++; else salah++;

                reviewHtml += `
                    <div class="bg-white p-6 rounded-xl shadow-sm border ${isBenar ? 'border-emerald-500' : 'border-red-500'} mb-4">
                        <p class="font-bold mb-2">${idx+1}. ${s.tanya}</p>
                        <div class="p-3 rounded text-sm ${isBenar ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                            <strong>Jawaban Anda:</strong> ${jwbSiswa || "Tidak Menjawab"}<br>
                            ${!isBenar ? `<span class="mt-2 block font-bold text-emerald-600">Kunci Benar Admin/Guru: ${s.kunci}</span>` : `<span class="mt-2 block font-bold">BENAR</span>`}
                        </div>
                    </div>
                `;
            });

            let bobot = 100 / soalDikerjakan.length;
            let nilaiAkhir = Math.round(benar * bobot);

            db.hasilUjian.push({
                id: Date.now(),
                nama: currentUser.name,
                mapel: activeExamSubject || 'Umum',
                benar,
                salah,
                nilai: nilaiAkhir,
                tgl: new Date().toLocaleDateString('id-ID')
            });
            saveData();

            reviewHtml += `
                <div class="bg-slate-900 text-white p-6 rounded-xl text-center shadow-xl mt-6">
                    <h3 class="text-xl uppercase tracking-widest text-slate-400">Total Nilai Ujian</h3>
                    <div class="text-6xl font-bold text-primary my-2">${nilaiAkhir}</div>
                    <p>Benar: <span class="text-emerald-400 font-bold">${benar}</span> | Salah: <span class="text-red-400 font-bold">${salah}</span></p>
                </div></div>
            `;
            document.getElementById('content-area').innerHTML = reviewHtml;
        }

        /* ================= MENU SISWA: RIWAYAT NILAI SAYA ================= */
        function renderNilaiSiswa() {
            let myScores = db.hasilUjian.filter(h => h.nama === currentUser.name);
            let html = `
                <h2 class="text-2xl font-bold text-slate-800 mb-6">Hasil & Riwayat Nilai Ujian Saya</h2>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table>
                        <thead><tr><th>Tanggal</th><th>Mata Ujian</th><th>Benar</th><th>Salah</th><th>Nilai Akhir</th></tr></thead>
                        <tbody>
                            ${myScores.map(h => `
                                <tr>
                                    <td>${h.tgl}</td>
                                    <td class="font-bold">${h.mapel || 'Ujian CBT'}</td>
                                    <td class="text-emerald-600 font-bold">${h.benar}</td>
                                    <td class="text-red-600 font-bold">${h.salah}</td>
                                    <td class="text-xl font-black text-primary">${h.nilai}</td>
                                </tr>
                            `).join('') || `<tr><td colspan="5" class="text-center py-6 text-slate-400">Belum ada riwayat nilai ujian.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
            setContent(html);
        }

        /* ================= FITUR 7: LAPORAN NILAI (ADMIN/GURU) ================= */
        function renderLaporan() {
            let html = `
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Laporan Otomatis Nilai Ujian Siswa</h2>
                        <p class="text-sm text-slate-500">Formula: (Benar / Total Soal) * 100</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table>
                        <thead><tr><th>Tanggal</th><th>Nama Siswa</th><th>Mata Ujian</th><th>Benar</th><th>Salah</th><th>Nilai Akhir</th><th>Aksi</th></tr></thead>
                        <tbody>${db.hasilUjian.map(h => `
                            <tr>
                                <td>${h.tgl}</td><td class="font-bold">${h.nama}</td><td>${h.mapel || 'Ujian CBT'}</td><td class="text-emerald-600 font-bold">${h.benar}</td><td class="text-red-600 font-bold">${h.salah}</td>
                                <td class="text-xl font-black text-primary">${h.nilai}</td>
                                <td><button onclick="hapusData('hasilUjian', ${h.id}, renderLaporan)" class="bg-red-500 text-white px-2 py-1 rounded text-xs">HAPUS</button></td>
                            </tr>
                        `).join('') || `<tr><td colspan="7" class="text-center py-4">Belum ada data nilai</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
            setContent(html);
        }

        /* --- GLOBAL UTILS --- */
        function hapusData(tabel, id, callback) {
            if(confirm('Yakin ingin menghapus data ini?')) {
                db[tabel] = db[tabel].filter(x => x.id !== id);
                saveData(); callback();
            }
        }

        function viewImage(base64) {
            let overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.onclick = () => document.body.removeChild(overlay);
            overlay.innerHTML = `<img src="${base64}" class="max-w-[90%] max-h-[90%] border-4 border-white rounded shadow-2xl">`;
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
