<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK SWASTA ASSISI - Portal Akademik Terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#e3242b', primaryDark: '#b91c22', surface: '#f8fafc' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; -webkit-font-smoothing: antialiased; }
        .hidden-section { display: none !important; }
        .prevent-select { user-select: none; -webkit-user-select: none; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; font-size: 12px; text-transform: uppercase; padding: 12px; border-bottom: 2px solid #e2e8f0; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; background: white; vertical-align: top; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- ================= 1. HALAMAN LOGIN ================= -->
    <div id="view-login" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 fade-in">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-primary">
            <div class="text-center mb-8">
                <div class="bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
                    <i class="fas fa-school"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">SMK SWASTA ASSISI</h2>
                <p class="text-slate-500 text-sm mt-1">SELAMAT DATANG DI Sistem SMK SWASTA ASSISI</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PERAN AKSES</label>
                    <select id="login-role" onchange="toggleKelasLogin()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        <option value="Siswa">SISWA/I</option>
                        <option value="Guru">GURU</option>
                        <option value="Admin">ADMIN</option>
                    </select>
                </div>
                <div id="login-kelas-group">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">KELAS (KHUSUS SISWA)</label>
                    <select id="login-kelas" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                        <option value="SEMUA">-- Semua Kelas --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">USERNAME</label>
                    <input type="text" id="login-username" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan NAMA/NIS/NIP">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">PASSWORD</label>
                    <input type="password" id="login-Password" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan PASSWORD">
                </div>
                <button onclick="prosesLogin()" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3.5 px-4 rounded-lg shadow-md transition duration-200">
                    LOGIN
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. SIDEBAR ================= -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm hidden-section z-20 h-full">
        <div class="p-5 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-primary text-white p-2 rounded-lg"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <h1 class="font-bold text-slate-800 leading-tight">SMK ASSISI</h1>
                <span id="badge-role" class="text-[10px] font-bold bg-slate-100 text-primary px-2 py-0.5 rounded-full uppercase tracking-wider">ROLE</span>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5" id="nav-menu">
            <!-- Nav buttons generated via JS based on role -->
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-bold"><i class="fas fa-user"></i></div>
                <div class="overflow-hidden">
                    <p id="display-name" class="text-sm font-bold text-slate-800 truncate">User</p>
                    <p id="display-kelas" class="text-xs text-slate-500 truncate"></p>
                </div>
            </div>
            <button onclick="prosesLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-lg text-white bg-slate-800 hover:bg-slate-900 transition-colors">
                <i class="fas fa-power-off"></i> KELUAR
            </button>
        </div>
    </aside>

    <!-- ================= 3. MAIN CONTENT ================= -->
    <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden hidden-section bg-slate-50">
        <!-- TOPBAR JAM BERJALAN NORMAL -->
        <div id="topbar-clock" class="bg-white border-b border-slate-200 px-6 py-2.5 flex justify-between items-center text-sm shadow-sm">
            <div class="font-semibold text-slate-600 flex items-center gap-2">
                <i class="fas fa-school text-primary"></i> Portal Akademik SMK Swasta Assisi
            </div>
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-lg font-mono font-bold text-slate-800">
                <i class="far fa-clock text-primary"></i>
                <span id="live-clock-normal">00:00:00</span>
            </div>
        </div>

        <!-- TOPBAR PERINGATAN UJIAN + JAM BERJALAN & SISA WAKTU -->
        <div id="topbar-warning" class="hidden-section bg-primary text-white px-6 py-3 flex flex-wrap justify-between items-center gap-3 shadow-md z-10">
            <div class="font-bold flex items-center gap-2">
                <i class="fas fa-shield-alt animate-pulse"></i>
                <span>MODE UJIAN AKTIF (ANTI-CHEAT)</span>
                <span id="exam-active-mapel" class="text-xs bg-white text-primary px-2 py-0.5 rounded font-extrabold">MAPEL</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-900/60 px-3 py-1.5 rounded-lg border border-white/20 flex items-center gap-2">
                    <i class="far fa-clock text-amber-300"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-slate-200 uppercase">Jam Sekarang</span>
                        <span id="live-clock-display" class="font-mono font-bold text-sm">00:00:00</span>
                    </div>
                </div>
                <div class="bg-black/30 px-4 py-1.5 rounded-lg border border-white/30 flex items-center gap-2">
                    <i class="fas fa-hourglass-half text-red-200 animate-spin"></i>
                    <div class="text-xs leading-tight">
                        <span class="block text-[10px] text-red-100 uppercase">Sisa Waktu</span>
                        <span id="timer-display" class="font-mono font-bold text-lg">00:00:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6" id="content-area">
            <!-- Tempat Konten Menu Dirender -->
        </div>
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        /* --- STATE & DATABASE LOKAL (LocalStorage) --- */
        let currentUser = { role: '', name: '', kelas: 'SEMUA' };
        let isExamActive = false;
        let examTimer = null;
        let liveClockInterval = null;
        let activeExamSubject = '';
        let html5QrScanner = null;

        let db = {
            jadwalUjian: JSON.parse(localStorage.getItem('db_jadwalUjian')) || [],
            jadwalHarian: JSON.parse(localStorage.getItem('db_jadwalHarian')) || [],
            presensi: JSON.parse(localStorage.getItem('db_presensi')) || [],
            materi: JSON.parse(localStorage.getItem('db_materi')) || [],
            soal: JSON.parse(localStorage.getItem('db_soal')) || [],
            hasilUjian: JSON.parse(localStorage.getItem('db_hasilUjian')) || [],
            nilaiTugasSiswa: JSON.parse(localStorage.getItem('db_nilaiTugasSiswa')) || [],
            catatan: JSON.parse(localStorage.getItem('db_catatan')) || []
        };

        const listKelas = ["10 RPL", "10 TB", "10 AK", "11 RPL", "11 TB", "11 AK", "12 RPL", "12 TB", "12 AK"];
        const listMapel = ["Agama", "PKN", "Bahasa Indonesia", "Matematika", "Bahasa Inggris", "Kejuruan RPL", "Kejuruan TB", "Kejuruan AK", "IPA", "IPS"];
        const listGuru = ["Sr.Gaudensia Silalahi", "H.Tindaon", "P.Tambunan", "E.Sirait", "E.Silalahi", "A.Lumbantobing", "M.Haloho", "E.Nainggolan", "L.Panggabean", "E.Gultom", "K.Silitonga", "O.Nadeak"];

        function saveData() {
            localStorage.setItem('db_jadwalUjian', JSON.stringify(db.jadwalUjian));
            localStorage.setItem('db_jadwalHarian', JSON.stringify(db.jadwalHarian));
            localStorage.setItem('db_presensi', JSON.stringify(db.presensi));
            localStorage.setItem('db_materi', JSON.stringify(db.materi));
            localStorage.setItem('db_soal', JSON.stringify(db.soal));
            localStorage.setItem('db_hasilUjian', JSON.stringify(db.hasilUjian));
            localStorage.setItem('db_nilaiTugasSiswa', JSON.stringify(db.nilaiTugasSiswa));
            localStorage.setItem('db_catatan', JSON.stringify(db.catatan));
        }

        function stopQrScannerSafe() {
            if (html5QrScanner) {
                try {
                    html5QrScanner.stop().then(() => {
                        html5QrScanner.clear();
                        html5QrScanner = null;
                    }).catch(() => { html5QrScanner = null; });
                } catch (e) {
                    html5QrScanner = null;
                }
            }
        }

        /* --- JAM BERJALAN REAL-TIME --- */
        function startLiveClock() {
            if (liveClockInterval) clearInterval(liveClockInterval);
            const updateClock = () => {
                const now = new Date();
                const jamStr = now.toLocaleTimeString('id-ID', { hour12: false });
                const tglStr = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                const elNormal = document.getElementById('live-clock-normal');
                const elTopbar = document.getElementById('live-clock-display');
                const elDash = document.getElementById('dashboard-live-clock');
                if (elNormal) elNormal.innerText = `${tglStr} \vert{}${jamStr} WIB`;
                if (elTopbar) elTopbar.innerText = jamStr + ' WIB';
                if (elDash) elDash.innerText = jamStr + ' WIB';
            };
            updateClock();
            liveClockInterval = setInterval(updateClock, 1000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const selKelas = document.getElementById('login-kelas');
            listKelas.forEach(k => {
                selKelas.innerHTML += `<option value="${k}">${k}</option>`; }); startLiveClock(); });  function toggleKelasLogin() { const role = document.getElementById('login-role').value; document.getElementById('login-kelas-group').classList.toggle('hidden-section', role !== 'Siswa'); }  /* --- LOGIN & LOGOUT --- */ function prosesLogin() { let role = document.getElementById('login-role').value; let name = document.getElementById('login-username').value.trim(); let kelas = document.getElementById('login-kelas').value; if (!name) { alert('Nama pengguna wajib diisi!'); return; }  currentUser = { role, name, kelas: role === 'Siswa' ? kelas : 'ALL' }; document.getElementById('view-login').classList.add('hidden-section'); document.getElementById('sidebar').classList.remove('hidden-section'); document.getElementById('main-content').classList.remove('hidden-section');  document.getElementById('badge-role').innerText = role; document.getElementById('display-name').innerText = name; document.getElementById('display-kelas').innerText = role === 'Siswa' ? `Kelas: ${kelas}` : 'Staf Pengajar / Admin';
            
            startLiveClock();
            renderMenu();
            renderDashboard();
        }

        function prosesLogout() {
            if (isExamActive) {
                picuAntiCheat("Sistem menolak logout. Anda masih dalam sesi ujian aktif!");
                return;
            }
            stopQrScannerSafe();
            location.reload();
        }

        /* --- NAVIGASI --- */
        function renderMenu() {
            const menu = document.getElementById('nav-menu');
            let html = `<button onclick="renderDashboard()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary transition-colors"><i class="fas fa-home w-5"></i> Beranda</button>`;
            
            if (currentUser.role === 'Admin' || currentUser.role === 'Guru') {
                html += `
                    <button onclick="renderPresensiQrForm('Guru')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold rounded-lg bg-red-50 text-primary hover:bg-red-100 transition-colors"><i class="fas fa-qrcode w-5"></i> Scan QR & Foto Guru</button>
                    <button onclick="renderPresensi()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-camera w-5"></i> Bukti Foto Kehadiran</button>
                    <button onclick="renderJadwalUjian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-check w-5"></i> Buat Jadwal Ujian</button>
                    <button onclick="renderManajemenSoal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-file-alt w-5"></i> Buat Soal Ujian</button>
                    <button onclick="renderJadwalHarian()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar-alt w-5"></i> Jadwal Harian</button>
                    <button onclick="renderMateri()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-book w-5"></i> Manajemen Materi</button>
                    <button onclick="renderUploadCatatan()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-sticky-note w-5"></i> Upload Catatan Siswa</button>
                    <button onclick="renderLihatNilaiTugasGuru()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-eye w-5"></i> Lihat Nilai Tugas Siswa</button>
                    <button onclick="renderLaporan()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-chart-bar w-5"></i> Laporan Nilai Ujian</button>
                `;
            } else if (currentUser.role === 'Siswa') {
                html += `
                    <button onclick="renderPresensiQrForm('Siswa')" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold rounded-lg bg-red-50 text-primary hover:bg-red-100 transition-colors"><i class="fas fa-qrcode w-5"></i> Scan QR & Bukti Foto</button>
                    <button onclick="renderUploadNilaiTugasSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition-colors"><i class="fas fa-upload w-5"></i> Upload Nilai Tugas</button>
                    <button onclick="renderJadwalSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-calendar w-5"></i> Jadwal Saya</button>
                    <button onclick="renderMateriSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-book w-5"></i> Materi Pembelajaran</button>
                    <button onclick="renderUploadCatatan()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-sticky-note w-5"></i> Catatan Guru & Saya</button>
                    <button onclick="renderUjianSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-laptop-code w-5"></i> Portal Ujian CBT</button>
                    <button onclick="renderNilaiSiswa()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-red-50 hover:text-primary"><i class="fas fa-award w-5"></i> Riwayat Nilai Ujian</button>
                `;
            }
            menu.innerHTML = html;
        }

        function setContent(html) {
            if (isExamActive) {
                picuAntiCheat("Dilarang berpindah menu selama ujian berlangsung!");
                return;
            }
            stopQrScannerSafe();
            document.getElementById('content-area').innerHTML = `<div class="fade-in">${html}</div>`;
        }

        /* --- GENERATOR OPSI --- */
        function genOptions(arr) { return arr.map(a => `<option value="${a}">${a}</option>`).join(''); }
        function genNumOptions(start, end) { 
            let res = ''; for(let i=start; i<=end; i++) res += `<option value="${i}">${i}</option>`; return res; 
        }

        /* ================= FITUR 1: BERANDA ================= */
        function renderDashboard() {
            const isSiswa = currentUser.role === 'Siswa';
            const myPresensi = db.presensi.filter(p => p.nama.toLowerCase() === currentUser.name.toLowerCase());
            const myNilaiTugas = db.nilaiTugasSiswa.filter(t => t.siswa.toLowerCase() === currentUser.name.toLowerCase());

            setContent(`
                <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">Selamat Datang, ${currentUser.name}!</h2>
                        <p class="text-slate-500">Anda login sebagai <span class="font-bold text-primary">${currentUser.role}</span> ${isSiswa ? `(${currentUser.kelas})` : ''} di Sistem Akademik SMK Swasta Assisi.</p>
                    </div>
                    <div class="bg-slate-900 text-white px-5 py-3 rounded-xl text-right">
                        <span class="text-[11px] uppercase tracking-wider text-slate-400 block">Waktu Server Saat Ini</span>
                        <span id="dashboard-live-clock" class="text-xl font-mono font-bold text-emerald-400">--:--:-- WIB</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Presensi & Bukti Foto</p>
                        <p class="text-3xl font-bold text-primary mt-1">${isSiswa ? myPresensi.length : db.presensi.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Sehari-hari & Ujian</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Jadwal Ujian Aktif</p>
                        <p class="text-3xl font-bold text-blue-600 mt-1">${db.jadwalUjian.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Tersinkronisasi otomatis</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Catatan Siswa</p>
                        <p class="text-3xl font-bold text-emerald-600 mt-1">${db.catatan.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Rangkuman & lampiran</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Upload Nilai Tugas Siswa</p>
                        <p class="text-3xl font-bold text-amber-500 mt-1">${isSiswa ? myNilaiTugas.length : db.nilaiTugasSiswa.length}</p>
                        <p class="text-xs text-slate-500 mt-1">${isSiswa ? 'Diupload oleh saya' : 'Mode lihat (Guru/Admin)'}</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div onclick="renderPresensiQrForm('${isSiswa ? 'Siswa' : 'Guru'}')" class="cursor-pointer bg-gradient-to-r from-primary to-red-700 text-white p-6 rounded-xl shadow-md hover:opacity-95 transition flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold">Scan QR & Bukti Foto Kehadiran (${isSiswa ? 'Siswa' : 'Guru'})</h3>
                            <p class="text-xs text-red-100 mt-1">Absensi Sehari-hari maupun Ujian dengan Scan QR & Bukti Foto</p>
                        </div>
                        <i class="fas fa-qrcode text-4xl opacity-80"></i>
                    </div>
                    <div onclick="${isSiswa ? 'renderUploadNilaiTugasSiswa()' : 'renderLihatNilaiTugasGuru()'}" class="cursor-pointer bg-slate-800 text-white p-6 rounded-xl shadow-md hover:bg-slate-900 transition flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold">${isSiswa ? 'Upload Nilai Tugas Siswa' : 'Lihat Nilai Tugas Siswa'}</h3>
                            <p class="text-xs text-slate-300 mt-1">${isSiswa ? 'Unggah nilai & bukti tugas Anda ke sistem' : 'Pantau daftar nilai tugas yang telah diupload siswa'}</p>
                        </div>
                        <i class="fas ${isSiswa ? 'fa-upload' : 'fa-eye'} text-4xl text-emerald-400"></i>
                    </div>
                </div>
            `);
            startLiveClock();
        }

        /* ================= FITUR BARU: SCAN QR + BUKTI FOTO KEHADIRAN (GURU & SISWA — SEHARI-HARI & UJIAN) ================= */
        function renderPresensiQrForm(targetPeran) {

        function updateQrPayloadPreview() {
            const role = currentUser.role === 'Siswa' ? 'SISWA' : 'GURU';

        function simulasiScanQr(roleLabel) {
            const tipe = document.getElementById('pres-tipe')?.value || 'Sehari-hari';
            const mapel = document.getElementById('pres-mapel')?.value || 'UMUM';
            const d = new Date().toISOString().split('T')[0];
            const kode = `ASSISI-${roleLabel.toUpperCase()}-${tipe.toUpperCase()}-${mapel.replace(/\s+/g,'').toUpperCase()}-${d}`;
            const inputQr = document.getElementById('pres-qr-code');
            if (inputQr) inputQr.value = kode;
        }

        function mulaiKameraQr() {
            const container = document.getElementById('qr-reader-container');
            container.classList.remove('hidden-section');
            stopQrScannerSafe();

            try {
                html5QrScanner = new Html5Qrcode("qr-reader");
                html5QrScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        document.getElementById('pres-qr-code').value = decodedText;
                        alert("QR Code berhasil dipindai: " + decodedText);
                        stopQrScannerSafe();
                        container.classList.add('hidden-section');
                    },
                    () => {}
                ).catch(() => {
                    alert("Kamera tidak terdeteksi atau izin ditolak browser. Gunakan tombol 'Scan / Token QR Otomatis' atau ketik kode QR.");
                    container.classList.add('hidden-section');
                });
            } catch (e) {
                alert("Scanner QR tidak tersedia di perangkat ini.");
            }
        }

        function previewUpload(input, previewBoxId, imgElId) {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let maxW = 400, maxH = 400;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxW) { height *= maxW / width; width = maxW; } }
                    else { if (height > maxH) { width *= maxH / height; height = maxH; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    let imgEl = document.getElementById(imgElId);
                    imgEl.src = dataUrl;
                    imgEl.dataset.base64 = dataUrl;
                    document.getElementById(previewBoxId).classList.remove('hidden-section');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

            e.preventDefault();
            let imgEl = document.getElementById('pres-img-element');
            let base64Img = imgEl ? imgEl.dataset.base64 : '';

            let d = new Date();
            db.presensi.push({

                mapel: document.getElementById('pres-mapel').value,

                foto: base64Img

            saveData();
            alert("Presensi Scan QR & Bukti Foto Kehadiran berhasil disimpan!");
            renderPresensiQrForm(targetPeran);
        }

        function saveCatatan(e) {
            e.preventDefault();
            let file = document.getElementById('cat-file').files[0];
            const saveFn = (fileDataUrl) => {
                db.catatan.push({
                    id: Date.now(),
                    tgl: new Date().toLocaleDateString('id-ID'),
                    judul: document.getElementById('cat-judul').value.trim(),
                    mapel: document.getElementById('cat-mapel').value,

                    fileName: file ? file.name : "",
                    fileData: fileDataUrl || ""
                });
                saveData();
                alert("Catatan berhasil diupload!");
                renderUploadCatatan();
            };
            if (file && file.size <= 1500000) {
                let reader = new FileReader();
                reader.onload = (ev) => saveFn(ev.target.result);
                reader.readAsDataURL(file);
            } else { saveFn(""); }

            e.preventDefault();

                mapel: document.getElementById('ju-mapel').value,

                lokasi: "SMK SWASTA ASSISI"

            else db.jadwalUjian.push(data);
            saveData(); renderJadwalUjian();

            setContent(html);
        }

        function saveMateri(e) {
            e.preventDefault();
            let file = document.getElementById('mat-file').files[0];
            const saveFn = (fileDataUrl) => {
                db.materi.push({
                    id: Date.now(),
                    tgl: document.getElementById('mat-tgl').value,
                    judul: document.getElementById('mat-judul').value,
                    mapel: document.getElementById('mat-mapel').value,
                    kelas: document.getElementById('mat-kelas').value,
                    guru: document.getElementById('mat-guru').value,
                    fileName: file ? file.name : "Document.pdf",
                    fileData: fileDataUrl || ""
                });
                saveData(); renderMateri();
            };
            if (file && file.size <= 1500000) {
                let reader = new FileReader();
                reader.onload = (ev) => saveFn(ev.target.result);
                reader.readAsDataURL(file);
            } else { saveFn(""); }
        }

        function toggleTipeSoal(val) {
            document.getElementById('soal-opsi-group').classList.toggle('hidden-section', val === 'Essay');
            document.getElementById('soal-kunci-essay-group').classList.toggle('hidden-section', val === 'PG');
        }

        function saveSoal(e) {
            e.preventDefault();
            let id = document.getElementById('soal-id').value;
            let tipe = document.getElementById('soal-tipe').value;
            let data = {
                id: id ? parseInt(id) : Date.now(),
                mapel: document.getElementById('soal-mapel').value,
                tipe: tipe,
                tanya: document.getElementById('soal-tanya').value,
                opsi: tipe === 'PG' ? {
                    A: document.getElementById('soal-a').value, B: document.getElementById('soal-b').value,
                    C: document.getElementById('soal-c').value, D: document.getElementById('soal-d').value,
                    E: document.getElementById('soal-e').value
                } : null,
                kunci: tipe === 'PG' ? document.getElementById('soal-kunci-pg').value : document.getElementById('soal-kunci-essay').value
            };
            if (id) db.soal = db.soal.map(x => x.id == id ? data : x);
            else db.soal.push(data);
            saveData(); renderManajemenSoal();
        }

        function editSoal(id) {
            let s = db.soal.find(x => x.id === id);
            if (!s) return;
            document.getElementById('soal-id').value = s.id;
            document.getElementById('soal-mapel').value = s.mapel;
            document.getElementById('soal-tipe').value = s.tipe;
            toggleTipeSoal(s.tipe);
            document.getElementById('soal-tanya').value = s.tanya;
            if (s.tipe === 'PG' && s.opsi) {
                document.getElementById('soal-a').value = s.opsi.A || '';
                document.getElementById('soal-b').value = s.opsi.B || '';
                document.getElementById('soal-c').value = s.opsi.C || '';
                document.getElementById('soal-d').value = s.opsi.D || '';
                document.getElementById('soal-e').value = s.opsi.E || '';
                document.getElementById('soal-kunci-pg').value = s.kunci;
            } else {
                document.getElementById('soal-kunci-essay').value = s.kunci;
            }
        }
